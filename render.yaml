services:
  - type: web
    name: upstack-api
    runtime: ruby
    plan: free
    rootDir: backend
    buildCommand: bundle install
    startCommand: bundle exec rails db:migrate && bundle exec puma -p $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://upstack-web.onrender.com

  - type: web
    name: upstack-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://upstack-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
